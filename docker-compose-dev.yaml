# DEV-кластер проекта AlfaHackathon.
# Все порты сервисов торчат наружу — для удобства локальной разработки
# (прямой доступ к swagger, базам, дебагу). В prod используйте docker-compose-prod.yaml.
# Перед запуском создайте файл .env рядом с compose-файлом (см. .env.example).

services:
  nginx:
    image: nginx:alpine
    container_name: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
    depends_on:
      - auth-gateway
    restart: unless-stopped

  auth-gateway:
    build:
      context: ../AuthGateway
      dockerfile: Gateway/Dockerfile
      secrets:
        - github_token
    image: alfahackathon/auth-gateway:latest
    container_name: auth-gateway
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Должны совпадать с настройками сервиса, который выпускает токены
      Jwt__Secret: ${JWT_SECRET:-dev-secret-0123456789abcdef-change-me}
      Jwt__Issuer: ${JWT_ISSUER:-AlfaHackathon}
      Jwt__Audience: ${JWT_AUDIENCE:-AlfaHackathon}
      # Downstream-сервисы гейтвея
      ReverseProxy__Clusters__user-service__Destinations__user-service__Address: ${SERVICES_ADDRESS:-http://user-service:8080}
      ReverseProxy__Clusters__auth-service__Destinations__auth-service__Address: ${AUTH_SERVICE_ADDRESS:-http://auth-service:8080}
      ReverseProxy__Clusters__agent-service__Destinations__agent-service__Address: ${AGENT_SERVICE_ADDRESS:-http://agent-service:3000}
    ports:
      # Прямой доступ к гейтвею в обход nginx
      - "8080:8080"
    restart: unless-stopped

  agent-service:
    build:
      context: ../AgentService
    image: alfahackathon/agent-service:latest
    container_name: agent-service
    # Model credentials stay in the ignored AgentService/.env file.
    env_file:
      - path: ../AgentService/.env
        required: false
    environment:
      PORT: "3000"
      DATABASE_URL: postgresql://agent:${AGENT_POSTGRES_PASSWORD:?Set AGENT_POSTGRES_PASSWORD}@agent-postgres:5432/agent_service
      DATABASE_POOL_MAX: "10"
    expose:
      - "3000"
    depends_on:
      agent-postgres:
        condition: service_healthy
    stop_grace_period: 65s
    restart: unless-stopped

  agent-postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: agent_service
      POSTGRES_USER: agent
      POSTGRES_PASSWORD: ${AGENT_POSTGRES_PASSWORD:?Set AGENT_POSTGRES_PASSWORD}
    volumes:
      - agent-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agent -d agent_service"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  auth-service:
    build:
      context: ../AuthService
      dockerfile: AuthService/Dockerfile
      args:
        # Нужен на сборке, чтобы восстановить пакет AlfaHackaton.Controllers из GitHub Packages
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    image: alfahackathon/auth-service:latest
    container_name: auth-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Совпадают с настройками гейтвея — он валидирует выпущенные токены
      Jwt__Secret: ${JWT_SECRET:-dev-secret-0123456789abcdef-change-me}
      Jwt__Issuer: ${JWT_ISSUER:-AlfaHackathon}
      Jwt__Audience: ${JWT_AUDIENCE:-AlfaHackathon}
      Services__UserService: ${USER_SERVICE_URL:-http://user-service:8080}
      Services__CompanyService: ${COMPANY_SERVICE_URL:-http://company-service:8080}
      # Общий секрет для внутренних вызовов между сервисами
      Internal__Secret: ${INTERNAL_SECRET:?INTERNAL_SECRET не задан в .env}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
    ports:
      - "8082:8080"
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-users}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Скрипт создаёт изолированные БД (user-service / company-service) на пустом volume
      - ./postgres-init:/docker-entrypoint-initdb.d:ro
    ports:
      # наружу — для подключения клиентов/IDE без кластера
      # 5432 занят на хосте, торчим на 5433
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-users}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  user-service:
    build:
      context: ../UserService
      dockerfile: Api/Dockerfile
      args:
        # Нужен на сборке, чтобы восстановить пакеты AlfaHackaton.* из GitHub Packages
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    image: alfahackathon/user-service:latest
    container_name: user-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Общий секрет для внутренних вызовов между сервисами
      Internal__Secret: ${INTERNAL_SECRET:?INTERNAL_SECRET не задан в .env}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Services__CompanyService: ${COMPANY_SERVICE_URL:-http://company-service:8080}
      # БД изолирована на сервис: у каждого своя база Postgres
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${USER_SERVICE_DB:-user-service};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8081:8080"
    restart: unless-stopped

  # Kafka (KRaft, single-node): события о новых новостях из web-news-parser-service
  kafka:
    image: apache/kafka:3.9.1
    container_name: kafka
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,EXTERNAL://:9094,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
    ports:
      # наружу — 9094, чтобы не конфликтовать с локальным kafka на хосте
      - "9094:9094"
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  # Парсер новостей (TASS/RBC/Alfa): Monad.getMinutes-время -> помощь newsparserweb-...- worker
  web-news-parser-service:
    build:
      context: ../WebNewsParserService
      dockerfile: Api/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    image: alfahackathon/web-news-parser-service:latest
    container_name: web-news-parser-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      # Общий секрет для внутренних вызовов между сервисами
      Internal__Secret: ${INTERNAL_SECRET:?INTERNAL_SECRET не задан в .env}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: news-parser
      Kafka__BootstrapServers: kafka:9092
      Kafka__Topic: news-parser.news
      Worker__TassPollIntervalSeconds: ${TASS_POLL_INTERVAL_SECONDS:-30}
    depends_on:
      mongo:
        condition: service_started
      kafka:
        condition: service_started
    ports:
      - "8086:8080"
    restart: unless-stopped

  # MongoDB: инвайты company-service с самоочисткой по TTL (протухшие удаляются сами)
  mongo:
    image: mongo:7
    container_name: mongo
    volumes:
      - mongo-data:/data/db
    ports:
      # наружу — для локальной разработки без кластера
      - "27018:27017"
    restart: unless-stopped

  company-service:
    build:
      # Контекст — корень репозитория: CompanyService (локальный ProjectReference MongoContext)
      context: ../CompanyService
      dockerfile: Api/Dockerfile
      args:
        GITHUB_TOKEN: ${GITHUB_TOKEN:-}
    image: alfahackaton/company-service:latest
    container_name: company-service
    environment:
      ASPNETCORE_URLS: http://+:8080
      Internal__Secret: ${INTERNAL_SECRET:?INTERNAL_SECRET не задан в .env}
      Swagger__Enabled: ${SWAGGER_ENABLED:-true}
      # БД изолирована на сервис: у каждого своя база Postgres
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=${COMPANY_SERVICE_DB:-company-service};Username=${POSTGRES_USER:-postgres};Password=${POSTGRES_PASSWORD:-postgres}
      Mongo__ConnectionString: mongodb://mongo:27017
      Mongo__Database: company-service
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started
    ports:
      - "8085:8080"
    restart: unless-stopped

secrets:
  github_token:
    file: ./.github-token

volumes:
  agent-postgres-data:
  postgres-data:
  mongo-data:
  kafka-data:
