# Входная точка кластера: весь трафик уходит в auth-gateway,
# а он уже распределяет запросы по сервисам.
# 127.0.0.11 - встроенный DNS Docker: резолвим upstream в рантайме (valid=10s),
# иначе nginx запоминает IP при старте и ломается после пересоздания контейнера.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;

    # Agent conversations include long-lived SSE responses. Preserve the URI;
    # forward all requests through AuthGateway, including stream reconnects.
    location /agent-service/ {
        set $upstream http://auth-gateway:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        set $upstream http://auth-gateway:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
