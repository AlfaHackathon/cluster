# Входная точка кластера: весь трафик уходит в auth-gateway,
# а он уже распределяет запросы по сервисам.
# 127.0.0.11 - встроенный DNS Docker: резолвим upstream в рантайме (valid=10s),
# иначе nginx запоминает IP при старте и ломается после пересоздания контейнера.
resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80;
    server_name api.cheremha.ru;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        default_type text/plain;
    }

    location / {
        return 308 https://api.cheremha.ru$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name api.cheremha.ru;
    ssl_certificate /etc/letsencrypt/live/api.cheremha.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.cheremha.ru/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:TLS:10m;
    ssl_session_timeout 1d;

    # Agent conversations include long-lived SSE responses. Preserve the URI;
    # forward all requests through AuthGateway, including stream reconnects.
    # Documentation only; internal business API is not routed.
    location ^~ /context-service/swagger/ {
        limit_except GET HEAD { deny all; }
        set $swagger_context_origin http://context-service:8080;
        proxy_pass $swagger_context_origin;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Internal-Secret "";
    }

    # Documentation only; internal business API is not routed.
    location ^~ /insight-service/swagger/ {
        limit_except GET HEAD { deny all; }
        set $swagger_insight_origin http://insight-service:8080;
        proxy_pass $swagger_insight_origin;
        proxy_set_header Host $host;
        proxy_set_header Authorization "";
        proxy_set_header X-Internal-Secret "";
    }

    location /agent-service/ {
        set $upstream http://auth-gateway:8080;
        proxy_pass $upstream;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        gzip off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        set $upstream http://auth-gateway:8080;
        proxy_pass $upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

include /var/www/certbot/.local-inference/nginx.conf;
